<style>
  :root {
    --ink: #1a1a1e;
    --paper: #f4f1ea;
    --muted: #6c665c;
    --accent: #a83000;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { overflow-x: clip; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Inter", -apple-system, "Helvetica Neue", sans-serif;
    min-height: 100vh; min-height: 100svh;
    display: flex;
    flex-direction: column;
  }
  header.bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: clamp(21px, 4vw, 34px) clamp(21px, 5vw, 55px);
  }
  .wordmark {
    font-family: "EB Garamond", Georgia, serif;
    font-size: 1.05rem;
    letter-spacing: 0.04em;
    color: var(--ink);
    text-decoration: none;
  }
  .bar nav { display: flex; gap: clamp(16px, 2vw, 30px); flex-wrap: wrap; }
  .bar nav a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    transition: color 0.3s ease;
    border-bottom: 2px solid transparent;
    padding-bottom: 4px;
  }
  .bar nav a:hover { color: var(--ink); }
  .bar nav a.here { color: var(--ink); border-bottom-color: var(--accent); }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(34px, 8vh, 89px) clamp(21px, 5vw, 55px);
    max-width: 760px;
  }
  .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1.2em;
  }
  h1 {
    font-family: "EB Garamond", Georgia, serif;
    font-weight: 500;
    font-size: clamp(3rem, 9vw, 6.5rem);
    line-height: 1.02;
    letter-spacing: 0.01em;
    margin-bottom: 0.35em;
  }
  .lede {
    font-family: "EB Garamond", Georgia, serif;
    font-size: clamp(1.15rem, 2.4vw, 1.6rem);
    line-height: 1.5;
    color: #3a3833;
    max-width: 30em;
  }
  .soon {
    margin-top: 2.6em;
    font-size: 0.74rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* --- site nav bar: identical on every page (explicit colours so it never
     drifts with a page's own light/dark variables) --- */
  .top { display: flex; justify-content: space-between; align-items: baseline;
    gap: 18px; padding: clamp(20px, 4vh, 40px) clamp(24px, 5vw, 72px) 0; border-bottom: 0; }
  .top .name { font-family: "EB Garamond", Georgia, serif; letter-spacing: 0.05em;
    font-size: 1.1rem; text-decoration: none; color: #1a191f; white-space: nowrap; }
  .top nav { display: flex; flex-wrap: wrap; gap: clamp(14px, 1.8vw, 28px); }
  .top nav a { color: rgba(26,24,20,0.55); text-decoration: none; font-size: 0.7rem;
    letter-spacing: 0.18em; text-transform: uppercase; transition: color .3s ease;
    border-bottom: 2px solid transparent; padding-bottom: 4px; }
  .top nav a:hover, .top nav a.here { color: #1a191f; }
  .top nav a.here { border-bottom-color: #a83000; }
  .artfoot { position: relative; width: 100%; height: clamp(120px, 20vh, 240px);
    background-size: cover; background-position: center; display: block; }

  /* mobile legibility */
  @media (max-width: 700px) {
    /* tracked uppercase labels fall to 10-11px on a phone; give them a floor */
    .bar nav a,
    .eyebrow,
    .soon { font-size: 0.78rem; }
    .top .name, .wordmark, footer.foot a { display: inline-block; padding-top: 11px; padding-bottom: 11px; }
  }
</style>

<div class="top">
  <a class="name" href="./">C. M. Taylor</a>
  <nav>
    <a href="books">Books</a>
    <a href="films">Films</a>
    <a href="essays">Essays</a>
    <a href="about">About</a>
    <a href="contact" class="here">Contact</a>
  </nav>
</div>

<main>
  <p class="eyebrow">Contact</p>
  <h1>Get in touch</h1>
  <p class="lede">For enquiries – publishing, film, teaching or press. Email and social links are being added here shortly.</p>
  <p class="soon">Coming soon</p>
</main>
