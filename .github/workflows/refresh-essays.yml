# Keeps the Essays page in step with Craig's Substack.
#
# This used to be a cron job on Jack's Mac, which meant the live site only
# updated when that machine happened to be on.
#
# It then ran the generator here on GitHub — and always failed with
# "HTTP Error 403: Forbidden". Substack sits behind Cloudflare, which blocks
# requests from GitHub's datacentre IP ranges however polite the request is.
# The feed itself was fine the whole time: it fetches from a home connection,
# and it fetches from Netlify's builders, which is the important part.
#
# So this job no longer fetches anything. It asks Netlify to rebuild, and
# Netlify's build runs tools/build_essays.py exactly as it does on every
# deploy, from an IP Substack is happy with. One line, nothing to break, and
# no commit needed — the page is generated at build time either way.
name: Refresh essays from Substack

on:
  schedule:
    # 08:00 UTC every Monday, matching the old cron
    - cron: "0 8 * * 1"
  workflow_dispatch:        # and a button, for testing or a new post mid-week

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Netlify to rebuild the site
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "NETLIFY_BUILD_HOOK secret is not set - nothing to call."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -d '{}' "$HOOK")
          echo "Netlify build hook returned HTTP $code"
          # Netlify answers 200 with the queued deploy; anything else is a
          # real failure worth an email rather than a silent no-op.
          [ "$code" = "200" ] || exit 1
          echo "Build queued. Netlify regenerates essays.html from the live feed."
