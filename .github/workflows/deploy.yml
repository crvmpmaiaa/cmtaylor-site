# The only thing that deploys cmtaylorstory.com on a schedule.
#
# Netlify does not build on push (see `ignore` in netlify.toml), because on
# the old Free plan every Publish in the editor was a paid deploy and one busy
# morning ate half the month. Instead this runs every morning and deploys only
# if there is something to deploy: main has moved, or Craig's newest Substack
# post is not yet on the live Essays page. Craig can also press "Update the
# site" in the editor, which fires the same build hook straight away.
#
# tools/daily_deploy.py does the deciding, waits for Netlify, and then checks
# the live page for the newest essay. Anything short of "it is live" exits 1,
# so GitHub emails a failed run. "Nothing to deploy" is a clean exit.
name: Deploy to Netlify

on:
  schedule:
    - cron: "0 7 * * *"      # 07:00 UTC daily (GitHub often runs it late)
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy even if nothing looks changed"
        type: boolean
        default: false

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy if needed, then check the essays page
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
          FORCE: ${{ inputs.force == true }}
        run: python3 tools/daily_deploy.py
