# The editor Craig uses. Everything visible here is written for someone who has
# never used a CMS: plain labels, a short note under each one, and nothing
# technical on screen.
#
# Anything the site needs but Craig should never think about — SEO text, image
# alt text, colours, ordering, structured data — is either derived by the
# generators in tools/ or kept here as a hidden field. Hidden matters: Decap
# DELETES any field it is not told about when an entry is saved.

# git-gateway means Craig logs in with an email address and password, set up by
# invitation. He needs no GitHub account and never sees one — Netlify passes his
# changes through to the repository on his behalf.
backend:
  name: git-gateway
  branch: main

# Nothing Craig does goes straight to the live site.
#
# Every change he saves becomes a draft. He can make as many as he likes across
# a session, come back to them, change his mind, or throw one away — the public
# site does not move until he presses Publish. That also means a mistake, or an
# accidental delete, never reaches the site.
publish_mode: editorial_workflow

local_backend: true

media_folder: "assets/Film Static assets"
public_folder: "assets/Film Static assets"

collections:
  - name: films
    label: Films
    label_singular: Film
    description: >-
      Your films. Add one here and it gets its own page, and appears on the
      Films page with the others.
    folder: content/films
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} ({{fields.year}})"
    fields:
      - name: title
        label: Name of the film
        widget: string
      - name: year
        label: Year it was made
        widget: string
        pattern: ["^[0-9]{4}$", "Please write the year as four numbers, like 2026"]
      - name: mins
        label: How many minutes long
        widget: number
        value_type: int
        min: 1
      - name: logline
        label: One line about it
        widget: string
        hint: The single sentence that appears under the title.
      - name: desc
        label: A longer description
        widget: text
        required: false
        hint: A paragraph or two. Leave blank if you would rather not.
      - name: poster
        label: The poster
        widget: image
        required: false
        hint: >-
          Click to upload the poster image. You can leave this for now and add
          it later - the film just will not show a picture until you do.
      - name: vimeo
        label: Link to watch it
        widget: string
        required: false
        hint: >-
          Paste the Vimeo link here when the film is ready to watch. Leave it
          empty while the film is still going round festivals.
      - name: note
        label: A note about where it is up to
        widget: string
        required: false
        hint: For example - Currently screening at festivals. Leave blank if not needed.
      - name: laurels
        label: Festival awards
        widget: list
        required: false
        collapsed: false
        summary: "{{fields.alt}}"
        fields:
          - name: src
            label: Award picture
            widget: image
            required: false
          - name: alt
            label: Which festival
            widget: string
            default: Festival laurel
      # Filled in for you. Craig never sees these.
      - { name: poster_alt,    label: hidden, widget: hidden, required: false }
      - { name: hero_poster,   label: hidden, widget: hidden, required: false }
      - { name: badge,         label: hidden, widget: hidden, required: false }
      - { name: seo_desc,      label: hidden, widget: hidden, required: false }
      - { name: artfoot,       label: hidden, widget: hidden, required: false }
      - { name: og_type,       label: hidden, widget: hidden, required: false }
      - { name: vimeo_title,   label: hidden, widget: hidden, required: false }
      - { name: index_lazy,    label: hidden, widget: hidden, required: false }
      - { name: index_logline, label: hidden, widget: hidden, required: false }

  - name: books
    label: Books
    label_singular: Book
    description: >-
      Your novels. Add one here and it gets its own page, and joins the others
      on the Books page. Send Jack the cover artwork - it needs preparing before
      it will look right.
    folder: content/books
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} ({{fields.year}})"
    fields:
      - name: title
        label: Title of the book
        widget: string
      - name: year
        label: Year it came out
        widget: string
      - name: tagline
        label: One line about it
        widget: string
        hint: The single sentence that sits under the title.
      - name: blurb
        label: What the book is about
        widget: list
        collapsed: false
        field:
          name: paragraph
          label: Paragraph
          widget: markdown
        hint: One box per paragraph. Use the toolbar for italics.
      - name: quotes
        label: What the reviewers said
        widget: list
        required: false
        collapsed: false
        summary: "{{fields.source}}"
        fields:
          - name: text
            label: The quote
            widget: text
          - name: source
            label: Who said it
            widget: string
      - name: buy
        label: Where people can buy it
        widget: list
        required: false
        collapsed: false
        summary: "{{fields.name}}"
        fields:
          - name: name
            label: Shop name
            widget: string
          - name: url
            label: Web address
            widget: string
      - name: meta
        label: Publisher
        widget: string
        required: false
        hint: For example - Duckworth. Leave blank if there is not one.
      - name: note
        label: A closing line
        widget: string
        required: false
      - name: cover
        label: The cover
        widget: object
        fields:
          - name: src
            label: Cover picture
            widget: image
          - { name: type, label: hidden, widget: hidden, default: image }
          - { name: pos,  label: hidden, widget: hidden, default: "50% 50%" }
      # Filled in for you.
      - { name: num,    label: hidden, widget: hidden, required: false }
      - { name: accent, label: hidden, widget: hidden, required: false }
      - { name: seo,    label: hidden, widget: hidden, required: false }

  - name: pages
    label: About page
    files:
      - name: about
        label: About page
        file: content/about.json
        description: The words on your About page.
        fields:
          - name: h1
            label: Your name, as the big heading
            widget: string
            hint: Put stars around the part you want in italics, like Craig *Taylor*.
          - name: kicker
            label: Small word above your name
            widget: string
          - name: lead
            label: The quote at the top
            widget: text
          - name: bio
            label: About you
            widget: object
            collapsed: false
            fields:
              - name: opening
                label: Opening line
                widget: markdown
              - name: story
                label: Your story
                widget: list
                collapsed: false
                field:
                  name: paragraph
                  label: Paragraph
                  widget: markdown
                hint: One box per paragraph.
              - name: teaching_intro
                label: Line about your teaching
                widget: markdown
              - name: courses_ma
                label: Your MA courses
                widget: list
                collapsed: false
                hint: Shown under the heading "MA Publishing Media".
                field:
                  name: course
                  label: Course
                  widget: string
              - name: courses_ba
                label: Your undergraduate courses
                widget: list
                collapsed: false
                hint: Shown under the heading "BA Media, Journalism and Publishing".
                field:
                  name: course
                  label: Course
                  widget: string
              - name: editing
                label: Line about your editing work
                widget: markdown
              - name: personal
                label: The personal bit
                widget: markdown
              - name: substack
                label: Line about your Substack
                widget: markdown
          - name: praise_intro
            label: Line above the reviews
            widget: string
            required: false
          - name: praise
            label: What the reviewers said
            widget: list
            collapsed: false
            summary: "{{fields.source}}"
            fields:
              - name: quote
                label: The quote
                widget: string
              - name: source
                label: Who said it
                widget: string
