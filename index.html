<style>
  :root {
    --cobalt: #0a18a0;
    --cerulean: #2078b0;
    --copper: #a83000;
    --gold: #a86000;
    --ink: #111114;
    --paper: #f6f4ef;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { overflow-x: hidden; overflow-x: clip; overscroll-behavior: none; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: "Inter", -apple-system, "Helvetica Neue", sans-serif;
  }

  .hero {
    position: relative;
    height: 100vh; height: 100svh;
    overflow: hidden;
  }
  .hero video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 1.8s ease;
  }
  .hero video.ready { opacity: 1; }

  /* quiet scrim so type always reads, whatever the footage */
  .hero::after {
    content: "";
    position: absolute; inset: 0;
    background:
      linear-gradient(to top, rgba(10,10,14,0.55) 0%, rgba(10,10,14,0) 40%),
      linear-gradient(to bottom, rgba(10,10,14,0.45) 0%, rgba(10,10,14,0) 18%);
    pointer-events: none;
  }

  .hero-text {
    position: absolute;
    left: clamp(21px, 5vw, 55px);
    /* Fixed, not vh-based: the gap above the links comes from the wordmark's
       margin, which scales with width, so a height-based offset here made the
       two gaps drift apart on shorter screens. 34px keeps them level. */
    bottom: 34px;
    z-index: 2;
  }
  h1 {
    font-family: "EB Garamond", Georgia, serif;
    font-weight: 500;
    font-size: clamp(2.6rem, 7vw, 5.8rem);
    letter-spacing: 0.04em;
    line-height: 1.1;
    /* Fixed rather than em-based, to match the fixed offset below the links.
       An em margin scaled with the wordmark while the space under the links
       did not, so the two gaps only agreed at desktop widths. */
    margin-bottom: 50px;
  }

  /* The three links justify across a share of the wordmark's width. At 100%
     they spanned the full name; pulled in to 84% and centred, Books and Essays
     move inward while Films stays put in the middle. Tune with --nav-span.
     The negative margin cancels the trailing letter-space after the final "S"
     so the row reads as optically centred, not just mathematically. */
  nav.enter {
    --nav-span: 84%;
    display: flex;
    flex-wrap: wrap;
    width: var(--nav-span);
    margin: 0 auto;
    justify-content: space-between;
    gap: clamp(14px, 2vw, 28px);
  }
  nav.enter a:last-child { margin-right: -0.22em; }

  /* On phones the wordmark is too narrow to justify three tracked links across,
     so they wrapped and left Essays stranded on its own line. Let the block span
     the screen and space the links naturally instead. */
  @media (max-width: 560px) {
    .hero-text { right: clamp(21px, 5vw, 55px); }
    nav.enter { width: 100%; justify-content: flex-start; gap: 22px; }
    nav.enter a:last-child { margin-right: 0; }
  }
  nav.enter a {
    color: var(--paper);
    text-decoration: none;
    font-size: 0.78rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding-bottom: 6px;
    border-bottom: 2px solid transparent;
    transition: border-color 0.4s ease;
  }
  /* the flags supply the only colour in the chrome */
  nav.enter a:nth-child(1):hover { border-color: var(--cerulean); }
  nav.enter a:nth-child(2):hover { border-color: var(--copper); }
  nav.enter a:nth-child(3):hover { border-color: var(--gold); }

  .corner {
    position: absolute;
    top: clamp(20px, 4vh, 40px);
    right: clamp(24px, 5vw, 72px);
    z-index: 2;
    display: flex;
    gap: 28px;
  }
  .corner a {
    color: rgba(246,244,239,0.85);
    text-decoration: none;
    text-shadow: 0 1px 8px rgba(10,10,14,0.6);
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    transition: color 0.3s ease;
  }
  .corner a:hover { color: var(--paper); }

  /* Opt-in sound (the video must autoplay muted – browsers refuse to autoplay
     with audio at all). The button carries a "Play with sound" invitation that
     fades away after a few seconds, leaving just the speaker icon. */
  .sound {
    position: fixed;
    bottom: clamp(20px, 4vh, 34px);
    right: clamp(24px, 5vw, 64px);
    z-index: 60;
    display: flex; align-items: center; gap: 0;
    border: 0; cursor: pointer;
    background: rgba(10,10,14,0.34);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border-radius: 999px; padding: 9px 14px;
    color: rgba(246,244,239,0.9);
    text-shadow: 0 1px 8px rgba(10,10,14,0.6);
    font-family: inherit; font-size: 0.66rem; letter-spacing: 0.2em; text-transform: uppercase;
    transition: color 0.3s ease, opacity 0.35s ease, background 0.3s ease;
  }
  .sound .hint {
    max-width: 14em; margin-right: 0.7em; white-space: nowrap; overflow: hidden;
    transition: opacity 0.7s ease, max-width 0.7s ease, margin-right 0.7s ease;
  }
  .sound.hint-gone .hint { opacity: 0; max-width: 0; margin-right: 0; }
  /* on nav-away, fade the sound button out smoothly with the fold instead of it
     popping (it lives above the canvas at z-index 60, outside the hidden hero) */
  .sound.fade-out { opacity: 0; pointer-events: none; }
  .sound:hover, .sound:focus-visible { color: var(--paper); background: rgba(10,10,14,0.55); outline: none; }
  .sound svg { width: 20px; height: 20px; display: block; }
  .sound .on-mark { display: none; }
  .sound.on .muted-mark { display: none; }
  .sound.on .on-mark { display: inline; }

  /* --- The "book": two stacked page-leaves for the diagonal video-peel entry
     and for section-to-section page flips. Entering from the homepage peels the
     video to reveal the front leaf. Moving section→section flips the CURRENT
     leaf over (like turning a page) to reveal the next; clicking through to an
     individual book/film just swaps the front leaf's content (no flip). */
  #book {
    position: fixed; inset: 0;
    z-index: 10;
    display: none;
    overflow: hidden;
    background: var(--paper);
  }
  #book.show { display: block; }
  /* Two page-leaves (iframes). Section→section slides the next leaf in over the
     current one like turning to the next page; NB iframes can't be 3D-flipped
     in Chrome (they render black), so this is a 2D page-slide with a fold shadow. */
  #book .leaf {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0;
    background: var(--paper);
  }
  /* The hero sits above the book, so moving it away uncovers the section
     loaded underneath. It stays a live element in a live document the whole
     time, which is what keeps the video playing through the move.
     The background matters: the hero's only solid content is the video, and
     that fades in over 1.8s, so without a colour of its own the section behind
     showed through it for the first couple of seconds after a load. */
  .hero {
    z-index: 20;
    background: var(--ink);
    will-change: transform;
    transition: transform 0.72s cubic-bezier(.66, 0, .34, 1);
  }
  /* Books/Films/Essays sit along the bottom, so the video lifts up and off the
     top. About/Contact sit in the top corner, so it drops off the bottom. */
  .hero.cmt-slide-up   { transform: translateY(-100%); }
  .hero.cmt-slide-down { transform: translateY(100%); }
  @media (prefers-reduced-motion: reduce) { .hero { transition: none; } }
  #foldCanvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 50;
    pointer-events: none;
    visibility: hidden;
  }

  /* Framing individual clips on a phone.
     A phone crops the 16:9 footage hard from the sides, so a subject that sits
     comfortably off-centre on a wide screen can end up pushed out to one edge.
     These nudge the crop so the subject lands in the middle. Percentages are
     measured from the actual frames, not guessed: below 50% shows more of the
     left of the shot and moves the subject right, above 50% does the opposite. */
  @media (max-width: 700px) {
    .hero video[data-clip="LightCut"] { object-position: 47% 50%; }  /* traffic light */
    .hero video[data-clip="ChairCut"] { object-position: 57% 50%; }  /* the green chair */
    .hero video[data-clip="FireCut"]  { object-position: 47% 50%; }  /* the smoke */
  }

  /* mobile legibility */
  @media (max-width: 700px) {
    /* tracked uppercase labels fall to 10-11px on a phone; give them a floor */
    .corner a { font-size: 0.78rem; }
    /* standalone links need a finger-sized target, not a 14px one */
    .corner a { padding-top: 11px; padding-bottom: 11px; }
    /* The hero links carry a hover underline 6px under the text, so padding
       them would leave the rule floating. Expand the touch area with a pseudo
       instead, which leaves the type and the underline exactly where they are. */
    nav.enter a { position: relative; }
    nav.enter a::after { content: ""; position: absolute; inset: -12px -10px; }
    /* On a phone the nav spans the full width, so the sound button - 186px wide
       with its label showing - landed directly on top of Essays and swallowed
       the tap. Moved to the top-left, and a row below the corner links, since
       at that width the pill would otherwise collide with About/Contact too. */
    .sound { top: 80px; left: clamp(21px, 5vw, 55px); bottom: auto; right: auto; }
  }
</style>

<!-- sound toggle lives outside .hero so it can sit above the fold canvas and

<script>
  // Per-visit sequential hero: each visit shows the next video in Craig's
  // chosen order; localStorage remembers where the visitor got to.
  // WalkCut (the frosty walk that ends at the river) was dropped at Craig's
  // request: it read as a near-duplicate of Walk2Cut, the lone-tree one he
  // wanted kept. Tunnel, Fire and Chair came in to replace it.
  // Order matters: this is a per-visit cycle, so neighbours here are what a
  // returning visitor sees back to back (and the last wraps to the first).
  // Sequenced so consecutive visits never repeat a mood or palette.
  const HERO_VIDEOS = [
    "assets/Homepage Videos/Walk2Cut.mp4",  // frosted field, lone tree – cold
    "assets/Homepage Videos/TunnelCut.mp4", // stone tunnel and steps – warm, enclosed
    "assets/Homepage Videos/FireCut.mp4",   // smoke drifting over a green garden
    "assets/Homepage Videos/BallCut.mp4",   // dawn plaza, ball at rest
    "assets/Homepage Videos/PlantCut.mp4",  // interior, framed pictures and shadow
    "assets/Homepage Videos/LightCut.mp4",  // pink dusk sky, the traffic light
    "assets/Homepage Videos/ChairCut.mp4",  // green chair on a terrace at sunset
    "assets/Homepage Videos/GrassCut.mp4",  // backlit grasses and stone
  ];

  // Advance on every load, so a refresh does show a different film - that is the
  // point of the rotation. The only thing guarded against is *hammering* the
  // refresh: each clip is a separate 2-16MB download, and reloading faster than
  // the browser can settle was enough to stall the tab. So if the last load was
  // under a couple of seconds ago, hold the current clip (already cached, so it
  // costs nothing) rather than pulling another one down.
  const KEY = "cmt-hero-index";
  const STAMP = "cmt-hero-at";
  const SETTLE_MS = 2500;
  let i = 0;
  try {
    const seen = localStorage.getItem(KEY);
    const last = parseInt(localStorage.getItem(STAMP) || "0", 10);
    const hammering = seen !== null && (Date.now() - last) < SETTLE_MS;
    i = seen === null ? 0
      : hammering ? parseInt(seen, 10) % HERO_VIDEOS.length
                  : (parseInt(seen, 10) + 1) % HERO_VIDEOS.length;
    localStorage.setItem(KEY, i);
    localStorage.setItem(STAMP, Date.now());
  } catch (e) { /* private browsing etc: always video #1 */ }

  const v = document.getElementById("heroVideo");
  // Poster first, source second. On an old or slow device — an iPhone 7 caps at
  // iOS 15, and these clips are 2-16MB — the poster is what fills the hero
  // while the video downloads, and what stays there permanently if it never
  // decodes at all. Without it the hero is simply empty. One still per clip, so
  // whatever the rotation picked is what the visitor sees frozen.
  v.poster = HERO_VIDEOS[i].replace("Homepage Videos/", "Homepage Videos/posters/")
                           .replace(".mp4", ".jpg");
  v.src = HERO_VIDEOS[i];
  // Name the clip on the element so CSS can frame individual ones. Most are
  // fine with a centred crop, but a few have their subject off to one side,
  // and on a phone the crop is severe enough to push it out of the middle.
  v.dataset.clip = HERO_VIDEOS[i].split("/").pop().replace(".mp4", "");
  v.addEventListener("canplay", () => v.classList.add("ready"), { once: true });

  // --- Opt-in sound ---
  // The hero always autoplays MUTED (browsers block autoplay with sound). The
  // toggle lets a visitor turn the audio on with one click; it starts off every
  // visit, since unmuting can only happen on a user gesture.
  (function () {
    const btn = document.getElementById("soundToggle");
    if (!btn) return;

    // The choice is remembered between visits. It can't simply be applied on
    // load – unmuting is only permitted during a user gesture – so for someone
    // who has opted in before, the sound comes on the moment they touch the
    // page: first click, key, scroll or tap, wherever it lands.
    const KEY = "cmt-sound-on";
    let pref = null;
    try { pref = localStorage.getItem(KEY); } catch (e) { /* private browsing */ }

    // Split apart deliberately: the button must never show a state the video
    // is not actually in. It used to keep its "on" class while the video had
    // been muted on the way out, so coming back to the homepage showed sound
    // enabled with nothing playing.
    function markButton(on) {
      btn.classList.toggle("on", on);
      btn.setAttribute("aria-pressed", String(on));
      btn.setAttribute("aria-label", on ? "Turn sound off" : "Turn sound on");
    }

    function setSound(on, remember) {
      v.muted = !on;
      if (on) { v.play().catch(() => {}); }
      markButton(on);
      if (remember) { try { localStorage.setItem(KEY, on ? "1" : "0"); } catch (e) {} }
    }

    // The invitation is for people who haven't chosen yet. It retires on its own
    // after a few seconds, or the moment the button is used – whichever first.
    const HINT_MS = 6500;
    let hintTimer = null;
    function dropHint() {
      clearTimeout(hintTimer);
      btn.classList.add("hint-gone");
    }
    if (pref === null) { hintTimer = setTimeout(dropHint, HINT_MS); }
    else { dropHint(); }

    btn.addEventListener("click", () => {
      dropHint();
      pref = btn.classList.contains("on") ? "0" : "1";
      setSound(pref === "1", true);
    });

    // Wait for a gesture, then switch the sound on. Only used when the browser
    // has refused to start unmuted on its own.
    const events = ["pointerdown", "keydown", "touchstart", "wheel", "scroll"];
    let armed = false;
    function disarm() {
      if (!armed) return;
      armed = false;
      events.forEach((n) => removeEventListener(n, arm, true));
    }
    function arm(e) {
      // Ignore gestures aimed at a control. The sound button has its own
      // handler, and a click on a nav link is someone leaving the page —
      // resuming audio for the split second before it is muted again is just
      // a blip.
      if (e.target && e.target.closest && e.target.closest("a, button")) return;
      disarm();
      setSound(true, false);
    }
    function armGesture() {
      if (armed) return;
      armed = true;
      events.forEach((n) => addEventListener(n, arm, true));
    }
    // leaving the homepage cancels it outright
    document.querySelectorAll("nav.enter a, .corner a").forEach((a) =>
      a.addEventListener("pointerdown", disarm, true));

    // Put the video into whatever state the saved preference asks for.
    //
    // Try unmuted FIRST rather than always waiting for a gesture. Chrome allows
    // unmuted autoplay on a site the visitor has played sound on before, which
    // is exactly the person this preference belongs to — so for them it simply
    // works. Only if the browser refuses do we fall back to muted playback and
    // wait for a gesture, and the button follows the real state either way.
    function applyPreference() {
      if (pref !== "1") { setSound(false, false); return; }
      v.muted = false;
      let p = null;
      try { p = v.play(); } catch (e) { p = null; }
      if (p && p.then) {
        p.then(() => markButton(true))
         .catch(() => {
           v.muted = true;
           v.play().catch(() => {});
           markButton(false);
           armGesture();
         });
      } else {
        markButton(true);
      }
    }

    // Called again when the homepage comes back into view, because leaving it
    // mutes the video on purpose and nothing was putting the choice back.
    // The wordmark click that brings the reader home is itself a gesture, so
    // unmuting is permitted at that point.
    window.CMT_syncSound = applyPreference;

    applyPreference();
  })();

  // --- Diagonal wave page-turn into Books / Films / Essays ---
  // The video page peels away on a wave from the bottom-left to the top-right
  // corner, revealing the chosen page beneath. Implementation lives in fold.js.
  // Version stamp appended to every page loaded into the book's iframes. Because
  // those iframe loads are script-initiated AFTER page load, a hard refresh does
  // NOT bypass the HTTP cache for them – so a stale cached section page (and the
  // old fold-child.js it references) can survive. A fresh ?v= URL is never cached,
  // forcing the current code. Bump this whenever the shell/child protocol changes.
  window.CMT_V = "?v=20260825a";
  function withV(href) {
    if (!href || /^https?:/i.test(href) || href.charAt(0) === "#") return href;
    return href.indexOf("?") === -1 ? href + window.CMT_V : href;
  }
  window.CMT_withV = withV;

  // Which way the video leaves: away from the link that was pressed.
  const SLIDE_DOWN = { about: 1, contact: 1 };
  const base = (h) => h.split("/").pop().replace(/\.html$/, "");

  const destLayer = document.getElementById("destLayer");
  function warm(href) {
    var stamped = withV(href);
    if (destLayer && destLayer.getAttribute("src") !== stamped) destLayer.setAttribute("src", stamped);
  }
  document.querySelectorAll("a[data-fold]").forEach((link) => {
    const href = link.getAttribute("href");
    // preload the destination on hover/touch so the reveal stays seamless
    link.addEventListener("pointerenter", () => warm(href));
    link.addEventListener("touchstart", () => warm(href), { passive: true });
    link.addEventListener("click", (ev) => {
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce || ev.metaKey || ev.ctrlKey || ev.shiftKey || !window.CMTFold) return;
      ev.preventDefault();
      // Kill hero audio the instant we start folding away – the fold keeps the
      // video playing for the peel animation, so without this an unmuted video's
      // sound carries over onto the next page.
      v.muted = true;
      // fade the sound button out with the fold instead of it vanishing instantly
      var sb = document.getElementById("soundToggle");
      if (sb) sb.classList.add("fade-out");
      warm(href);
      window.CMTFold.slide(href, SLIDE_DOWN[base(href)] ? "down" : "up");
    });
  });
</script>
